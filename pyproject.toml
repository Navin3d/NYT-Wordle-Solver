[project]
name = "nyt-wordle-solver"
version = "0.1.0"
description = "LangGraph-powered AI agent that solves the NYT Wordle puzzle daily"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=2.14.1",
    "langchain>=1.2.0",
    "langchain-classic>=1.0.1",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.5",
    "python-dotenv>=1.2.1",
    "slack-sdk>=3.39.0",
]

[tool.uv]
package = false
